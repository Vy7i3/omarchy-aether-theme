# Aether — bar surface
# Replaces the generated [bar] section. Alpha is the opaque-mode value; the
# bar's own Glassy mode caps it at 0.35.

[bar]
background       = "#070b14"
background-alpha = 0.55
text             = "#e6f1ff"
active           = "#00f0ff"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32
