# Aether — Ghostty palette
# Omarchy includes this file from ~/.config/ghostty/config.

background = #070b14
foreground = #e6f1ff
cursor-color = #00f0ff
selection-background = #12384a
selection-foreground = #f7fcff

# Glass. Hyprland blurs the transparent surface; the GTK stylesheet asks the
# compositor for a backdrop blur as well, which covers Ghostty's GTK chrome.
background-opacity = 0.72
gtk-custom-css = /usr/share/omarchy/default/gtk/glass.css

palette = 0=#070b14
palette = 1=#ff4d6d
palette = 2=#5cf2c5
palette = 3=#ffd166
palette = 4=#4cc9f0
palette = 5=#a855f7
palette = 6=#00f0ff
palette = 7=#e6f1ff
palette = 8=#2b3f57
palette = 9=#ff7a93
palette = 10=#8bffe0
palette = 11=#ffe39a
palette = 12=#8bdcff
palette = 13=#c084fc
palette = 14=#7df9ff
palette = 15=#f7fcff
