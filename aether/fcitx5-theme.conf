# Aether — fcitx5 candidate window
# Synced to ~/.local/share/fcitx5/themes/omarchy/theme.conf by
# omarchy-theme-set-fcitx5; the panel is deliberately solid because fcitx5's
# classic UI cannot be compositor-blurred.

[Metadata]
Name=Omarchy
Version=1
Author=Omarchy
Description=Aether — cyber-ethereal frosted glass
ScaleWithDPI=True

[InputPanel]
NormalColor=#e6f1ff
HighlightCandidateColor=#070b14
HighlightColor=#070b14
HighlightBackgroundColor=#00f0ff
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=12
Right=12
Top=8
Bottom=8

[InputPanel/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/Background]
Color=#070b14
BorderColor=#12384a
BorderWidth=2

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color=#00f0ff

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=5
Bottom=5

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=6
Right=6
Top=5
Bottom=5

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=6
Right=6
Top=5
Bottom=5

[Menu]
NormalColor=#e6f1ff
HighlightCandidateColor=#070b14

[Menu/Background]
Color=#070b14
BorderColor=#12384a
BorderWidth=2

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Color=#00f0ff

[Menu/Highlight/Margin]
Left=8
Right=8
Top=5
Bottom=5

[Menu/Separator]
Color=#2b3f57

[Menu/TextMargin]
Left=12
Right=12
Top=8
Bottom=8
