# Aether — lock screen password field
# Replaces the generated [lock] section. The lock background itself is the
# current wallpaper, blurred by the lock view; this card floats on top of it.

[lock]
background       = "#070b14"
background-alpha = 0.72
text             = "#e6f1ff"
placeholder      = "#6b7f99"
text-error       = "#ff4d6d"
border           = "rgba(00f0ffee) rgba(a855f7ee) 45deg"
border-active    = "rgba(00f0ffee) rgba(a855f7ee) 45deg"
border-error     = "#ff4d6d"
border-alpha     = 1.0
selection        = "#00f0ff"
selection-alpha  = 0.40
