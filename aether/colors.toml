# Aether — cyber-ethereal frosted glass
# Deep midnight/obsidian surfaces, electric cyan, neon violet.
# This is the single source of truth: Omarchy renders Neovim, VS Code,
# tmux, fzf, gum, Obsidian, browser policy, and the remaining templates
# from these values when the theme is applied.

mode = "dark"

# ── Core surfaces ───────────────────────────────────────────────────────────
background         = "#070b14"
dark_background    = "#04060c"
darker_background  = "#020309"
lighter_background = "#111a2b"

# ── Type ────────────────────────────────────────────────────────────────────
foreground        = "#e6f1ff"
dark_foreground   = "#6b7f99"
light_foreground  = "#cfe3f7"
bright_foreground = "#f7fcff"
muted             = "#2b3f57"

# ── Accents, selection, chrome ──────────────────────────────────────────────
accent                    = "#00f0ff"
selection                 = "#12384a"
selection_background      = "#12384a"
selection_foreground      = "#f7fcff"
active_border_color       = "#00f0ff"
active_tab_background     = "#00f0ff"

# Hyprland gets the signature cyan → violet border gradient.
hyprland_active_border    = "rgba(00f0ffee) rgba(a855f7ee) 45deg"
hyprland_inactive_border  = "rgba(2b3f5799)"

# ── Semantic ANSI palette ───────────────────────────────────────────────────
red             = "#ff4d6d"
yellow          = "#ffd166"
orange          = "#ff9e64"
green           = "#5cf2c5"
cyan            = "#00f0ff"
blue            = "#4cc9f0"
magenta         = "#a855f7"
brown           = "#7a5c7e"

bright_red      = "#ff7a93"
bright_yellow   = "#ffe39a"
bright_green    = "#8bffe0"
bright_cyan     = "#7df9ff"
bright_blue     = "#8bdcff"
bright_magenta  = "#c084fc"

# ── Legacy ANSI 0–15 view ───────────────────────────────────────────────────
# Omarchy aliases these from the semantic names above. They are declared
# explicitly so older scripts and portable palette readers get the same
# 16-color table without having to know Omarchy's resolver.
color0  = "#070b14"
color1  = "#ff4d6d"
color2  = "#5cf2c5"
color3  = "#ffd166"
color4  = "#4cc9f0"
color5  = "#a855f7"
color6  = "#00f0ff"
color7  = "#e6f1ff"
color8  = "#2b3f57"
color9  = "#ff7a93"
color10 = "#8bffe0"
color11 = "#ffe39a"
color12 = "#8bdcff"
color13 = "#c084fc"
color14 = "#7df9ff"
color15 = "#f7fcff"
