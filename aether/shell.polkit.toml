# Aether — polkit authentication prompt
# Replaces the generated [polkit] section.

[polkit]
background       = "#070b14"
background-alpha = 0.80
text             = "#e6f1ff"
text-error       = "#ff4d6d"
border           = "rgba(00f0ffee) rgba(a855f7ee) 45deg"
border-error     = "#ff4d6d"
border-alpha     = 1.0
scrim            = "#020309"
scrim-alpha      = 0.45
accent           = "#00f0ff"
