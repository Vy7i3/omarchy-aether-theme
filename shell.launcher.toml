# Aether — launcher overlay
# Replaces the generated [launcher] section.

[launcher]
background                = "#070b14"
background-alpha          = 0.72
text                      = "#e6f1ff"
border                    = "rgba(00f0ffee) rgba(a855f7ee) 45deg"
border-alpha              = 1.0
scrim                     = "#020309"
scrim-alpha               = 0.42
selected-background       = "#00f0ff"
selected-background-alpha = 0.12
selected-text             = "#00f0ff"
selected-border           = "rgba(00f0ffee) rgba(a855f7ee) 45deg"
selected-border-alpha     = 0.60
