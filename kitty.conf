# Aether — kitty palette
# Frosted obsidian, electric cyan, neon violet.
# Omarchy includes this file from ~/.config/kitty/kitty.conf.

foreground #e6f1ff
background #070b14

selection_foreground #f7fcff
selection_background #12384a

cursor #00f0ff
cursor_text_color #070b14
url_color #00f0ff

# ── Glass ───────────────────────────────────────────────────────────────────
# 0.72 over the luminous veil wallpaper reads as unmistakable frosted glass
# while keeping glyph contrast.
# dynamic_background_opacity lets a theme reload change this without a restart.
background_opacity 0.72
dynamic_background_opacity yes
# Hyprland performs the real backdrop blur. This only has an effect on
# compositors that implement the KDE blur protocol.
background_blur 32

# ── Chrome ──────────────────────────────────────────────────────────────────
active_border_color #00f0ff
inactive_border_color #2b3f57
active_tab_background #00f0ff
active_tab_foreground #070b14
inactive_tab_background #111a2b
inactive_tab_foreground #cfe3f7

# ── ANSI ────────────────────────────────────────────────────────────────────
color0 #070b14
color8 #2b3f57

color1 #ff4d6d
color9 #ff7a93

color2 #5cf2c5
color10 #8bffe0

color3 #ffd166
color11 #ffe39a

color4 #4cc9f0
color12 #8bdcff

color5 #a855f7
color13 #c084fc

color6 #00f0ff
color14 #7df9ff

color7 #e6f1ff
color15 #f7fcff
